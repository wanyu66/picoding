services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: fault-test-only
      MYSQL_DATABASE: outbox_rank_fault
    ports:
      - "127.0.0.1:13316:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pfault-test-only"]
      interval: 2s
      timeout: 2s
      retries: 60
  rabbit:
    image: rabbitmq:4-management
    ports:
      - "127.0.0.1:15682:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 5s
      retries: 30
  redis:
    image: redis:8.0
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always"]
    ports:
      - "127.0.0.1:16389:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
