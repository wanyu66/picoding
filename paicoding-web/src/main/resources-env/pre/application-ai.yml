net:
  proxy:
    # 代理相关信息
    - ip: 127.0.0.1
      port: 1080
      type: SOCKS



ai:
  web-search:
    api-key: ${PAICODING_AI_WEB_SEARCH_API_KEY:${PAICODING_OPENAI_API_KEY:}}
    api-host: ${PAICODING_AI_WEB_SEARCH_API_HOST:https://api.openai.com/v1}
    model: ${PAICODING_AI_WEB_SEARCH_MODEL:gpt-5.4-mini}
    search-context-size: ${PAICODING_AI_WEB_SEARCH_CONTEXT_SIZE:medium}
    timeout: ${PAICODING_AI_WEB_SEARCH_TIMEOUT:60}
    coding-mcp-url: ${PAICODING_AI_WEB_SEARCH_CODING_MCP_URL:https://open.bigmodel.cn/api/mcp/web_search_prime/mcp}

  context:
    max-input-tokens: ${PAICODING_CHAT_CONTEXT_MAX_INPUT_TOKENS:3000}
    reserve-output-tokens: ${PAICODING_CHAT_CONTEXT_RESERVE_OUTPUT_TOKENS:800}
    summary-max-chars: ${PAICODING_CHAT_CONTEXT_SUMMARY_MAX_CHARS:600}
    max-message-chars: ${PAICODING_CHAT_CONTEXT_MAX_MESSAGE_CHARS:4000}

llm:
  timeout-ms: ${PAICODING_LLM_TIMEOUT_MS:10000}
  max-retries: ${PAICODING_LLM_MAX_RETRIES:1}
  circuit-failure-threshold: ${PAICODING_LLM_CIRCUIT_FAILURES:3}
  circuit-open-seconds: ${PAICODING_LLM_CIRCUIT_OPEN_SECONDS:30}
  per-minute: ${PAICODING_LLM_PER_MINUTE:10}
  max-concurrent-per-user: ${PAICODING_LLM_MAX_CONCURRENT:2}
  daily-quota: ${PAICODING_LLM_DAILY_QUOTA:100}
  abnormal-daily-usage: ${PAICODING_LLM_ABNORMAL_DAILY_USAGE:80}
  routes:
    CHAT:
      primary-provider: ${PAICODING_LLM_CHAT_PROVIDER:}
      primary-model: ${PAICODING_LLM_CHAT_MODEL:}
      fallback-provider: ${PAICODING_LLM_CHAT_FALLBACK_PROVIDER:}
      fallback-model: ${PAICODING_LLM_CHAT_FALLBACK_MODEL:}
      input-cost-per-million: ${PAICODING_LLM_CHAT_INPUT_COST:0}
      output-cost-per-million: ${PAICODING_LLM_CHAT_OUTPUT_COST:0}
    SEO:
      primary-provider: ${PAICODING_LLM_SEO_PROVIDER:zhipu}
      primary-model: ${PAICODING_LLM_SEO_MODEL:glm-4-air-0111}
      fallback-provider: ${PAICODING_LLM_SEO_FALLBACK_PROVIDER:doubao}
      fallback-model: ${PAICODING_LLM_SEO_FALLBACK_MODEL:}
      timeout-ms: 10000
      max-retries: 1
      input-cost-per-million: ${PAICODING_LLM_SEO_INPUT_COST:0}
      output-cost-per-million: ${PAICODING_LLM_SEO_OUTPUT_COST:0}
    SUMMARY:
      primary-provider: ${PAICODING_LLM_SUMMARY_PROVIDER:doubao}
      primary-model: ${PAICODING_LLM_SUMMARY_MODEL:}
      fallback-provider: ${PAICODING_LLM_SUMMARY_FALLBACK_PROVIDER:zhipu}
      fallback-model: ${PAICODING_LLM_SUMMARY_FALLBACK_MODEL:glm-4-air-0111}
      input-cost-per-million: ${PAICODING_LLM_SUMMARY_INPUT_COST:0}
      output-cost-per-million: ${PAICODING_LLM_SUMMARY_OUTPUT_COST:0}
    MODERATION:
      primary-provider: ${PAICODING_LLM_MODERATION_PROVIDER:zhipu}
      primary-model: ${PAICODING_LLM_MODERATION_MODEL:glm-4-air-0111}
      fallback-provider: ${PAICODING_LLM_MODERATION_FALLBACK_PROVIDER:doubao}
      fallback-model: ${PAICODING_LLM_MODERATION_FALLBACK_MODEL:}
      input-cost-per-million: ${PAICODING_LLM_MODERATION_INPUT_COST:0}
      output-cost-per-million: ${PAICODING_LLM_MODERATION_OUTPUT_COST:0}


zhipu:
  coding:
    apiKey: ${PAICODING_ZHIPU_CODING_API_KEY:}

# chatgpt
chatgpt:
  main: CHAT_GPT_3_5
  conf:
    CHAT_GPT_3_5:
      keys:
        - # 这里输入你的key
      proxy: true # 表示走上面的代理进行访问
      apiHost: https://api.openai.com/
      timeOut: 900
      maxToken: 3000
    CHAT_GPT_4:
      keys:
        -
      proxy: true
      apiHost: https://api.openai.com/
      timeOut: 900
      maxToken: 200000
  number:
    # 普通用户
    normal: 50
    vip: 100



# 讯飞AI
xunfei:
  hostUrl: http://spark-api.xf-yun.com/v1.1/chat
  appId:
  apiKey:
  apiSecret:

deepseek:
  apiHost: https://api.deepseek.com
  apiKey: # 使用自己的密钥进行替换
  model: deepseek-chat
  timeout: 900 # 超时时间，单位秒

doubao:
  api-key: # 使用自己的密钥进行替换
  api-host: https://ark.cn-beijing.volces.com/api/v3
  end-point: # 使用自己创建的接入点进行替换
