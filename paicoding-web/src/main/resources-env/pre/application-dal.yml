spring:
  datasource:
    url: jdbc:mysql://pre.hhui.top/${database.name}?useUnicode=true&allowPublicKeyRetrieval=true&autoReconnect=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: pre_root
    password:
  redis:
    host: localhost
    port: 6379
    password:

# elasticsearch配置
elasticsearch:
  # 是否开启ES？本地启动如果没有安装ES，可以设置为false关闭ES
  open: false
  # 文章全文搜索索引，避免和其他项目共用索引名
  article-index: paicoding_article_v1
  article-alias: paicoding_article
  rebuild-batch-size: 500
  rebuild-max-retries: 3
  consistency-sample-size: 20
  consistency-check-cron: "0 30 3 * * ?"
  search-max-page: 50
  search-cache-ttl-seconds: 120
  search-cursor-ttl-seconds: 300
  search-timeout-ms: 1500
  search-connection-request-timeout-ms: 200
  circuit-failure-threshold: 5
  circuit-open-seconds: 30
  slow-query-threshold-ms: 500
  # es集群名称
  clusterName: elasticsearch
  hosts: 127.0.0.1:9200
  userName: elastic
  password: elastic
  # es 请求方式
  scheme: http
  # es 连接超时时间
  connectTimeOut: 1000
  # es socket 连接超时时间
  socketTimeOut: 3000
  # es 请求超时时间
  connectionRequestTimeOut: 500
  # es 最大连接数
  maxConnectNum: 100
  # es 每个路由的最大连接数
  maxConnectNumPerRoute: 100
