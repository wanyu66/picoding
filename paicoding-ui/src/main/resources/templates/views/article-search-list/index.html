<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<div th:replace="components/layout/header :: head(~{::title}, ~{}, ~{})">
    <title th:text="${global.siteInfo.websiteName}">技术派</title>
</div>
<style>
    .search-wrap-out {
        height: calc(100vh - 60px);
        overflow-y: auto;
    }

    .search-wrap {
        width: 1200px;
        margin: 0 auto;
        padding: 20px;
    }

    .search-list {
        padding: 20px;
        background-color: #fff;
        border-radius: 8px;
    }

    .search-highlight {
        color: #d33a2c;
        background: #fff2a8;
        font-style: normal;
    }
</style>
<body id="body">
<!-- 导航栏 -->
<div th:replace="components/layout/navbar :: navbar"></div>

<!-- 正文内容 -->
<div class="search-wrap-out">
    <div class="search-wrap">
        <!-- 文章列表 -->
        <div class="search-list" id="articleList">
            <div th:replace="views/article-search-list/article/list">文章列表</div>
        </div>

        <div th:if="${#lists.isEmpty(vo.articles.list)}">
            <a>没有查询到任何记录。</a>
        </div>
    </div>
</div>

<script src="/js/biz/loadMore.js" th:src="${global.siteInfo.oss + '/js/biz/loadMore.js'}"></script>
<script th:inline="javascript">
    const searchKey = new URLSearchParams(window.location.search).get("key") || ""
    const params = {
        "key": searchKey,
        "page": 2
    }
    loadMore("#articleList", "/search/api/list", params, "articleList");
    document.getElementById("articleList").addEventListener("click", function (event) {
        const card = event.target.closest("[data-article-id]")
        if (!card || !searchKey) return
        const endpoint = "/search/api/click?key=" + encodeURIComponent(searchKey)
            + "&articleId=" + encodeURIComponent(card.dataset.articleId)
        if (navigator.sendBeacon) navigator.sendBeacon(endpoint)
        else fetch(endpoint, {method: "POST", keepalive: true})
    })
</script>
</body>

</html>
